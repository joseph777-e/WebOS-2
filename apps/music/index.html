<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelOS Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="window music-window">
      <div class="window-bar">
        <div class="window-title">Music</div>
        <div class="window-controls" aria-label="Window controls">
          <button class="win-btn close-btn" type="button" aria-label="Close Music window">×</button>
        </div>
      </div>

      <div class="window-body">
        <div class="album-wrap">
          <div class="album-art">
            <img src="../../assets/music/album-art.svg" alt="Midnight Drive album art" />
          </div>
        </div>

        <div class="track-meta">
          <h2>Midnight Drive</h2>
          <p>Neon System</p>
        </div>

        <div class="controls">
          <button class="nav-btn" id="prev-btn" aria-label="Previous track">⏮</button>
          <button class="play-btn" id="play-btn" aria-label="Play or pause">▶</button>
          <button class="nav-btn" id="next-btn" aria-label="Next track">⏭</button>
        </div>

        <div class="progress-block">
          <span class="time" id="current-time">0:12</span>
          <div class="progress-wrap" aria-label="Song progress">
            <div class="progress-track" id="progress-track">
              <div class="progress-fill" id="progress-fill"></div>
              <div class="progress-thumb" id="progress-thumb"></div>
            </div>
          </div>
          <span class="time" id="total-time">3:42</span>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
