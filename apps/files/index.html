<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelOS Files</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="window files-window">
      <div class="window-bar">
        <div class="window-title">Files</div>
        <div class="window-controls" aria-label="Window controls">
          <button class="win-btn close-btn" type="button" aria-label="Close Files window">×</button>
        </div>
      </div>

      <div class="window-body">
        <div class="file-layout">
          <aside class="sidebar">
            <div class="folder active" data-folder="home">Home</div>
            <div class="folder" data-folder="documents">Documents</div>
            <div class="folder" data-folder="pictures">Pictures</div>
            <div class="folder" data-folder="music">Music</div>
            <div class="folder" data-folder="projects">Projects</div>
          </aside>

          <main class="file-panel">
            <div class="breadcrumbs" id="breadcrumbs">Home</div>
            <div id="file-grid" class="file-grid"></div>
          </main>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
