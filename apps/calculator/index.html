<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelOS Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="window calc-window">
      <div class="window-bar">
        <div class="window-title">Calculator</div>
        <div class="window-controls" aria-label="Window controls">
          <button class="win-btn close-btn" type="button" aria-label="Close Calculator window">×</button>
        </div>
      </div>

      <div class="window-body">
        <div class="display-wrap">
          <div class="display-expression" id="display-expression"></div>
          <div class="display-result" id="display-result">0</div>
        </div>

        <div class="keypad">
          <button class="key key-fn" data-action="clear">AC</button>
          <button class="key key-fn" data-action="negate">±</button>
          <button class="key key-fn" data-action="percent">%</button>
          <button class="key key-op" data-action="divide">÷</button>

          <button class="key key-num" data-value="7">7</button>
          <button class="key key-num" data-value="8">8</button>
          <button class="key key-num" data-value="9">9</button>
          <button class="key key-op" data-action="multiply">×</button>

          <button class="key key-num" data-value="4">4</button>
          <button class="key key-num" data-value="5">5</button>
          <button class="key key-num" data-value="6">6</button>
          <button class="key key-op" data-action="subtract">−</button>

          <button class="key key-num" data-value="1">1</button>
          <button class="key key-num" data-value="2">2</button>
          <button class="key key-num" data-value="3">3</button>
          <button class="key key-op" data-action="add">+</button>

          <button class="key key-num key-zero" data-value="0">0</button>
          <button class="key key-num" data-value=".">.</button>
          <button class="key key-eq" data-action="equals">=</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
