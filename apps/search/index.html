<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelOS Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="window search-window">
      <div class="window-bar">
        <div class="window-title">Search</div>
        <div class="window-controls" aria-label="Window controls">
          <button class="win-btn close-btn" type="button" aria-label="Close Search window">×</button>
        </div>
      </div>

      <div class="window-body">
        <h1 class="welcome-title">
          Welcome to<br />
          your search<br />
          browser
        </h1>

        <div class="search-field">
          <span class="icon">⌕</span>
          <input id="search-input" type="text" placeholder="Search..." aria-label="Search" />
        </div>

        <div class="results" id="results" aria-live="polite">
          <div class="result empty">Try searching for something cool.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
